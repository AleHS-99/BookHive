name: Build BookHive App

on:
  workflow_dispatch:          # Ejecución manual desde Actions
  push:
    tags:
      - 'v*'                  # Al crear un tag como v1.0.0, v2.0.0-beta, etc.

permissions:
  contents: write

jobs:
  # ============ WINDOWS ============
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Instalar pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11.17.0

      - name: Cache de Rust (Cargo)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias del frontend
        run: pnpm install

      - name: Build de Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "BookHive v__VERSION__"
          releaseBody: "Nueva versión disponible. Descarga el instalador para Windows."
          releaseDraft: true
          prerelease: false

  # ============ LINUX ============
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Instalar pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11.17.0

      - name: Cache de Rust (Cargo)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias del frontend
        run: pnpm install

      - name: Build de Tauri (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "BookHive v__VERSION__"
          releaseBody: "Nueva versión disponible. Descarga el paquete para Linux (.deb / .AppImage)."
          releaseDraft: true
          prerelease: false

  # ============ ANDROID (CORREGIDO) ============
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Rust con targets para Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Instalar pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11.17.0

      - name: Instalar Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK y NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest

      # Instalar herramientas adicionales
      - name: Instalar herramientas adicionales
        run: sudo apt-get install -y cmake ninja-build

      - name: Cache de Rust (Cargo)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias del frontend
        run: pnpm install

      # Inicializar proyecto Android si no existe
      - name: Inicializar Tauri Android
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            pnpm tauri android init
          else
            echo "✅ Proyecto Android ya inicializado"
          fi

      # Verificar la estructura del proyecto Android
      - name: Verificar estructura Android
        run: |
          echo "📁 Estructura de src-tauri/gen/android:"
          ls -la src-tauri/gen/android/app/build/outputs/apk/ || echo "⚠️ La carpeta outputs/apk no existe aún"
          echo ""
          echo "📁 Estructura completa de gen/android:"
          find src-tauri/gen/android -type f -name "*.gradle" | head -10

      # Construir APK - PRIMER INTENTO: debug build
      - name: Build APK (debug)
        run: pnpm tauri android build
        continue-on-error: true

      # Si falla, intentar con un build más detallado
      - name: Si falló, intentar build con verbose
        if: failure()
        run: |
          echo "🔧 Intentando build con más detalle..."
          cd src-tauri
          cargo build --target aarch64-linux-android
          cd ..
          pnpm tauri android build -- --verbose

      # Buscar APK en diferentes ubicaciones posibles
      - name: Buscar APK generado
        id: find_apk
        run: |
          APK_PATH=""
          
          # Buscar en ubicaciones comunes
          LOCATIONS=(
            "src-tauri/gen/android/app/build/outputs/apk/debug/*.apk"
            "src-tauri/gen/android/app/build/outputs/apk/*/*.apk"
            "src-tauri/gen/android/app/build/outputs/apk/*.apk"
            "src-tauri/gen/android/app/build/outputs/*.apk"
            "src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk"
          )
          
          for LOC in "${LOCATIONS[@]}"; do
            if ls $LOC 2>/dev/null | grep -q .; then
              APK_PATH=$(ls $LOC 2>/dev/null | head -1)
              echo "✅ APK encontrado en: $APK_PATH"
              break
            fi
          done
          
          if [ -n "$APK_PATH" ]; then
            echo "apk_found=true" >> $GITHUB_OUTPUT
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          else
            echo "❌ No se encontró ningún APK"
            echo "apk_found=false" >> $GITHUB_OUTPUT
            echo "📁 Contenido de build/outputs:"
            find src-tauri/gen/android -type d -name "outputs" -exec ls -la {} \;
          fi

      # Subir APK si se encontró
      - name: Subir APK como artefacto
        if: steps.find_apk.outputs.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bookhive-android-debug
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: warn

      # Si no se encontró APK, subir logs para depuración
      - name: Subir logs de build si falló
        if: steps.find_apk.outputs.apk_found == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            src-tauri/gen/android/*/build/outputs/**/*.txt
            src-tauri/gen/android/*/build/outputs/**/*.log
            src-tauri/gen/android/*/build/reports/**/*.html
          if-no-files-found: ignore
