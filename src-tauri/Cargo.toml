[package]
name = "bookhive"
version = "0.1.0"
description = "Una aplicación para organizar y gestionar libros electrónicos"
authors = ["AleHS"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bookhive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
walkdir = "2.5.0"
epub = "2.1.5"
image = { version = "0.25.10", features = ["webp"] }
webp = "0.3.1"
reqwest = {version = "0.13.4", default-features = false, features = ["rustls", "cookies", "stream", "gzip"] }
scraper = "0.27.0"
urlencoding = "2.1.3"
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros"] }
tauri-plugin-os = "2.3.2"

