name: Test Keystore Secret

on:
  workflow_dispatch:

jobs:
  test-secret:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Check if secrets exist
        run: |
          echo "=== Checking secrets ==="
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "❌ ANDROID_KEYSTORE_BASE64 está vacío o no existe"
            exit 1
          else
            echo "✅ ANDROID_KEYSTORE_BASE64 existe ($(echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | wc -c) bytes)"
          fi
          
          if [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then
            echo "❌ ANDROID_KEY_ALIAS está vacío"
            exit 1
          else
            echo "✅ ANDROID_KEY_ALIAS = ${{ secrets.ANDROID_KEY_ALIAS }}"
          fi
          
          if [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "❌ ANDROID_KEY_PASSWORD está vacío"
            exit 1
          else
            echo "✅ ANDROID_KEY_PASSWORD existe"
          fi
          
          if [ -z "${{ secrets.ANDROID_STORE_PASSWORD }}" ]; then
            echo "❌ ANDROID_STORE_PASSWORD está vacío"
            exit 1
          else
            echo "✅ ANDROID_STORE_PASSWORD existe"
          fi
      
      - name: Test base64 decoding
        run: |
          echo "=== Testing base64 decode ==="
          
          # Contar saltos de línea en el secret
          NEWLINES=$(echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | wc -l)
          echo "Saltos de línea en el secret: $NEWLINES"
          
          if [ "$NEWLINES" -gt 1 ]; then
            echo "⚠️  El base64 tiene saltos de línea. Esto puede causar problemas."
            echo "Debes regenerarlo con: base64 -w 0 bookhive.keystore"
          fi
          
          # Intentar decodificar
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/test-keystore.jks 2>/tmp/decode-error.txt
          DECODE_EXIT=$?
          
          if [ $DECODE_EXIT -ne 0 ]; then
            echo "❌ Falló la decodificación:"
            cat /tmp/decode-error.txt
            exit 1
          fi
          
          echo "✅ Decodificación exitosa"
          
          # Verificar tamaño
          SIZE=$(stat -c%s /tmp/test-keystore.jks)
          echo "Tamaño del archivo: $SIZE bytes"
          
          if [ "$SIZE" -lt 100 ]; then
            echo "❌ El archivo es demasiado pequeño. El base64 probablemente está mal."
            exit 1
          fi
          
          # Verificar que sea un JKS válido
          file /tmp/test-keystore.jks
          
          # Intentar listar con keytool
          echo "=== Verificando con keytool ==="
          keytool -list -keystore /tmp/test-keystore.jks \
            -storepass "${{ secrets.ANDROID_STORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" 2>&1 || {
              echo "❌ keytool no pudo leer la keystore. Posibles causas:"
              echo "   - Contraseña del store incorrecta"
              echo "   - Alias incorrecto"
              echo "   - El archivo no es una keystore válida"
              exit 1
            }
          
          echo "✅ Keystore válida y verificada"