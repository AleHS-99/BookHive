name: Build BookHive App

on:
  workflow_dispatch:          # Ejecución manual desde Actions
  push:
    branches: [ develop ]     # Ejecutar en pushes a develop
    tags:
      - 'v*'                  # Al crear un tag como v1.0.0

permissions:
  contents: write

jobs:
  # ============ WINDOWS ============
  build-windows:
    name: Build Windows
    if: |
      github.event_name == 'workflow_dispatch' || 
      startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Instalar pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11.17.0

      - name: Cache de Rust (Cargo)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias del frontend
        run: pnpm install

      - name: Build de Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "BookHive v__VERSION__"
          releaseBody: "Nueva versión disponible. Descarga el instalador para Windows."
          releaseDraft: true
          prerelease: false

  # ============ LINUX ============
  build-linux:
    name: Build Linux
    if: |
      github.event_name == 'workflow_dispatch' || 
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Instalar pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11.17.0

      - name: Cache de Rust (Cargo)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias del frontend
        run: pnpm install

      - name: Build de Tauri (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "BookHive v__VERSION__"
          releaseBody: "Nueva versión disponible. Descarga el paquete para Linux (.deb / .AppImage)."
          releaseDraft: true
          prerelease: false

  # ============ ANDROID (CORREGIDO) ============
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Rust con targets para Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Instalar pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11.17.0

      - name: Instalar Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK y NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest

      # Instalar herramientas adicionales
      - name: Instalar herramientas adicionales
        run: sudo apt-get install -y cmake ninja-build

      - name: Cache de Rust (Cargo)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias del frontend
        run: pnpm install

      # Inicializar proyecto Android si no existe
      - name: Inicializar Tauri Android
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            pnpm tauri android init
          else
            echo "✅ Proyecto Android ya inicializado"
          fi

      # 🔥 GENERAR APK DEBUG (para instalar directamente)
      - name: Build APK Debug (firmado automáticamente)
        run: pnpm tauri android build --apk --debug
        continue-on-error: true

      # Si falla debug, intentar con gradle directamente
      - name: Si falla, build con Gradle (debug)
        if: failure()
        run: |
          cd src-tauri/gen/android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 🔥 Buscar APK debug
      - name: Buscar APK Debug
        id: find_debug_apk
        run: |
          DEBUG_APK=$(find src-tauri/gen/android -name "*debug*.apk" 2>/dev/null | head -1)
          
          if [ -n "$DEBUG_APK" ]; then
            echo "✅ APK Debug encontrado: $DEBUG_APK"
            echo "apk_found=true" >> $GITHUB_OUTPUT
            echo "apk_path=$DEBUG_APK" >> $GITHUB_OUTPUT
          else
            echo "❌ No se encontró APK Debug"
            echo "apk_found=false" >> $GITHUB_OUTPUT
            
            # Buscar cualquier APK
            ANY_APK=$(find src-tauri/gen/android -name "*.apk" 2>/dev/null | head -1)
            if [ -n "$ANY_APK" ]; then
              echo "ℹ️ Pero se encontró APK release: $ANY_APK"
              echo "release_apk_found=true" >> $GITHUB_OUTPUT
              echo "release_apk_path=$ANY_APK" >> $GITHUB_OUTPUT
            fi
          fi

      # Subir APK Debug si existe
      - name: Subir APK Debug
        if: steps.find_debug_apk.outputs.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bookhive-android-debug
          path: ${{ steps.find_debug_apk.outputs.apk_path }}
          if-no-files-found: ignore

      # Subir APK Release (unsigned) como alternativa
      - name: Subir APK Release (unsigned)
        if: steps.find_debug_apk.outputs.release_apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bookhive-android-release-unsigned
          path: ${{ steps.find_debug_apk.outputs.release_apk_path }}
          if-no-files-found: ignore

      # Subir logs si todo falla
      - name: Subir logs de build si todo falló
        if: steps.find_debug_apk.outputs.apk_found == 'false' && steps.find_debug_apk.outputs.release_apk_found == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            src-tauri/gen/android/*/build/outputs/**/*.txt
            src-tauri/gen/android/*/build/outputs/**/*.log
            src-tauri/gen/android/*/build/reports/**/*.html
          if-no-files-found: ignore
