name: Build All Platforms

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            target: ''
          - platform: 'windows-latest'
            target: ''

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'BookHive v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false

  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev webkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          yes | sdkmanager --licenses

      - name: Set NDK_HOME
        run: echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      # ============================================
      # PASOS CRÍTICOS PARA LA KEYSTORE
      # ============================================

      - name: Verify keystore secrets exist
        run: |
          echo "Verificando secrets..."
          
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "❌ ERROR: ANDROID_KEYSTORE_BASE64 no está configurado"
            exit 1
          fi
          echo "✅ ANDROID_KEYSTORE_BASE64 existe ($(echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | wc -c) bytes)"
          
          if [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then
            echo "❌ ERROR: ANDROID_KEY_ALIAS no está configurado"
            exit 1
          fi
          echo "✅ ANDROID_KEY_ALIAS = ${{ secrets.ANDROID_KEY_ALIAS }}"
          
          if [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "❌ ERROR: ANDROID_KEY_PASSWORD no está configurado"
            exit 1
          fi
          echo "✅ ANDROID_KEY_PASSWORD existe"
          
          if [ -z "${{ secrets.ANDROID_STORE_PASSWORD }}" ]; then
            echo "❌ ERROR: ANDROID_STORE_PASSWORD no está configurado"
            exit 1
          fi
          echo "✅ ANDROID_STORE_PASSWORD existe"
          
          echo "Todos los secrets están configurados correctamente"

      - name: Decode and setup keystore
        run: |
          echo "=== Configurando keystore ==="
          
          echo "1. Decodificando keystore desde base64..."
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > src-tauri/gen/android/app/keystore.jks
          
          echo "2. Verificando que el archivo se creó..."
          if [ ! -f "src-tauri/gen/android/app/keystore.jks" ]; then
            echo "❌ ERROR: El archivo keystore.jks no se creó"
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "src-tauri/gen/android/app/keystore.jks")
          echo "✅ Archivo creado: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "❌ ERROR: El archivo es demasiado pequeño. El base64 está mal formado."
            exit 1
          fi
          
          echo "3. Creando keystore.properties..."
          cat > src-tauri/gen/android/keystore.properties << EOF
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          storeFile=app/keystore.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          EOF
          
          echo "4. Verificando keystore.properties..."
          if [ ! -f "src-tauri/gen/android/keystore.properties" ]; then
            echo "❌ ERROR: keystore.properties no se creó"
            exit 1
          fi
          
          echo "Contenido de keystore.properties (sin passwords):"
          grep -E "^(keyAlias|storeFile)=" src-tauri/gen/android/keystore.properties
          
          echo "5. Verificando keystore con keytool..."
          keytool -list -keystore src-tauri/gen/android/app/keystore.jks \
            -storepass "${{ secrets.ANDROID_STORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" || {
              echo "❌ ERROR: keytool no pudo leer la keystore"
              echo "Posibles causas:"
              echo "  - La contraseña del store es incorrecta"
              echo "  - El alias es incorrecto"
              echo "  - El archivo no es una keystore válida"
              exit 1
            }
          
          echo "✅ Keystore configurada correctamente"

      # ============================================
      # BUILD DE ANDROID
      # ============================================

      - name: Build signed Android APKs
        run: pnpm tauri android build --apk
        env:
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep -m1 'version =' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Upload APKs to Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}